<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Google Gemini Multi-stop Vibrant Gradient -->
    <linearGradient id="geminiSparkleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1aa260"/>
      <stop offset="25%" stop-color="#ffce44"/>
      <stop offset="50%" stop-color="#1a73e8"/>
      <stop offset="75%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
    <radialGradient id="geminiCoreGrad" cx="50%" cy="50%" r="60%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#174ea6"/>
    </radialGradient>
  </defs>

  <g transform="translate(100, 150)">
    <!-- 4-point curved Gemini Sparkle Star -->
    <g transform="translate(150, 300) scale(1.6)">
      <path fill="url(#geminiSparkleGrad)" d="M 0,-150 C 0,-40 40,0 150,0 C 40,0 0,40 0,150 C 0,40 -40,0 -150,0 C -40,0 0,-40 0,-150 Z" />
    </g>

    <!-- Gemini Typography -->
    <g transform="translate(480, 390)">
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Google Sans', 'SF Pro Display', Roboto, sans-serif" font-size="280" font-weight="700" fill="currentColor" letter-spacing="-4">Gemini</text>
    </g>
  </g>
</svg>
